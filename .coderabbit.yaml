# yaml-language-server: $schema=https://www.coderabbit.ai/integrations/schema.v2.json
language: ko-KR
early_access: false
tone_instructions: "Report actionable findings with a concrete trigger, impact, and file location. Separate verified defects from uncertainty. Avoid praise and cosmetic churn."

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary_in_walkthrough: true
  review_status: true
  review_progress: true
  fail_commit_status: true
  collapse_walkthrough: true
  sequence_diagrams: false
  poem: false
  in_progress_fortune: false
  auto_apply_labels: false
  auto_assign_reviewers: false
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    # Initial review plus at most two automatic follow-up reviews.
    auto_pause_after_reviewed_commits: 3
  path_filters:
    - "!docs/benchmarks/*.json"
    - "!assets/**"
  path_instructions:
    - path: "src/features/**"
      instructions: "Enforce the deterministic analysis contract in AGENTS.md and docs/ARCHITECTURE.md. Check transitive model/network/secret access, including global fetch and process.env. Treat scoring changes as behavior changes requiring regression evidence."
    - path: "{src,bin,api}/**"
      instructions: "Check exact-output verification, numbers/entities/polarity/modality/causation, cancellation cleanup, authentication boundaries, and private data in logs. Follow the canonical contracts; do not propose prompt or threshold tuning as cleanup."
    - path: ".github/workflows/**"
      instructions: "Check least privilege, required checks, explicit network profiles, source/artifact identity, cancellation, and publication authorization. A skipped, stale, or incomplete check is not a pass."
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false
    simplify:
      enabled: false

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - AGENTS.md
      - CONTRIBUTING.md
      - docs/WORKFLOW.md
      - docs/ARCHITECTURE.md
      - docs/QA.md
  learnings:
    scope: local
  issues:
    scope: local
  pull_requests:
    scope: local
  automatic_linking_mode: disabled
  mcp:
    usage: disabled

chat:
  auto_reply: false
  art: false

issue_enrichment:
  auto_enrich:
    enabled: false
  planning:
    enabled: false
  labeling:
    auto_apply_labels: false
