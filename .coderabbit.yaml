# yaml-language-server: $schema=https://www.coderabbit.ai/integrations/schema.v2.json
language: ko-KR
early_access: false

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary_in_walkthrough: true
  review_status: true
  review_progress: true
  fail_commit_status: true
  collapse_walkthrough: true
  sequence_diagrams: false
  poem: false
  in_progress_fortune: false
  auto_apply_labels: false
  auto_assign_reviewers: false
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false
    simplify:
      enabled: false

knowledge_base:
  code_guidelines:
    enabled: false
  learnings:
    scope: local
  issues:
    scope: local
  pull_requests:
    scope: local
  automatic_linking_mode: disabled
  mcp:
    usage: disabled

chat:
  auto_reply: false
  art: false

issue_enrichment:
  auto_enrich:
    enabled: false
  planning:
    enabled: false
  labeling:
    auto_apply_labels: false
