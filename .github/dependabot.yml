version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      devtools:
        dependency-type: development
        update-types:
          - patch
          - minor
    ignore:
      # Held until the TypeScript 7 readiness unit (#862) is complete.
      # Patch and minor updates keep flowing through the devtools group.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
