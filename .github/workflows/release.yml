name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish npm packages instead of running a dry-run.
        type: boolean
        default: false
      publish_ghcr:
        description: Also publish the experimental GHCR image. Keep false for npm-only releases.
        type: boolean
        default: false

concurrency:
  # One release publisher at a time. queue:max keeps up to GitHub's hosted
  # pending-run limit; cancel-in-progress is deliberately false.
  group: patina-release-publication
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.artifacts.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint, typecheck, and codespell
        run: npm run lint

      - name: Release metadata check
        run: npm run release:check

      - name: Unit and e2e tests
        run: npm test

      - name: Benchmark report schema
        run: npm run benchmark:report

      - name: Detector comparison harness
        # Runs before the drift check so the regenerated
        # docs/benchmarks/detector-comparison.{json,md} are drift-checked too.
        run: npm run benchmark:compare

      - name: Benchmark report drift check
        # Same deterministic regen as test.yml's quality job (timestamp and
        # node-version metadata lines ignored); a failure here means the
        # tagged commit ships a stale public benchmark page.
        run: |
          git diff --exit-code -I '"generatedAt":' -I '"benchmarkGeneratedAt":' -I 'Generated at:' -I '"nodeVersion":' -I '^- Node: ' -- docs/benchmarks || {
            echo '::error::docs/benchmarks is stale. Run `npm run benchmark:report && npm run benchmark:compare` and commit the result.'
            exit 1
          }

      - name: Dogfood public docs
        run: npm run dogfood

      - name: Private asset leak gate
        run: npm run check:no-private-assets

      - name: Root npm package dry run
        run: npm pack --dry-run

      - name: Alias npm package dry run
        run: cd packages/patina-humanizer && npm pack --dry-run

      - name: Build and verify release tarballs
        id: artifacts
        run: |
          node scripts/release-artifacts.mjs --output-dir .release-artifacts --source-sha "$GITHUB_SHA"
          node --input-type=module <<'EOF' >> "$GITHUB_OUTPUT"
          import { readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('.release-artifacts/release-manifest.json', 'utf8'));
          const version = JSON.parse(readFileSync('package.json', 'utf8')).version;
          if (manifest.version !== version || manifest.sourceSHA !== process.env.GITHUB_SHA) throw new Error('Release artifact identity mismatch');
          console.log(`version=${version}`);
          EOF

      - name: Upload verified release tarballs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-artifacts-${{ github.sha }}
          path: .release-artifacts
          include-hidden-files: true
          if-no-files-found: error

  authorize-source:
    needs: verify
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.publish == true || inputs.publish_ghcr == true))
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require a main-reachable release commit
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Manual publication must be dispatched from main."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release commit is not reachable from origin/main."
            exit 1
          fi

  npm:
    needs: [verify, authorize-source]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node 24 for npm
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: Verify release metadata
        run: npm run release:check

      - name: Download verified release tarballs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-artifacts-${{ github.sha }}
          path: .release-artifacts

      - name: Verify downloaded release tarballs
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          test -n "$RELEASE_VERSION"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then test "$GITHUB_REF_NAME" = "v$RELEASE_VERSION"; fi
          node scripts/release-artifacts.mjs --verify-only --output-dir .release-artifacts --source-sha "$GITHUB_SHA" --version "$RELEASE_VERSION"

      - name: Publish verified release tarballs with recovery
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: node scripts/release-artifacts.mjs --publish --output-dir .release-artifacts --source-sha "$GITHUB_SHA" --version "$RELEASE_VERSION"

  github-release:
    needs: [verify, npm]
    runs-on: ubuntu-latest
    # Tag pushes only: workflow_dispatch dry-runs must not create releases,
    # and a release is only recorded after npm publish actually succeeded.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node 24 for GitHub release helpers
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install release helper dependencies
        run: npm ci

      - name: Extract changelog notes for this version
        run: |
          node <<'EOF' > release-notes.md
          const { readFileSync } = require("node:fs");
          const changelog = readFileSync("CHANGELOG.md", "utf8");
          const version = process.env.GITHUB_REF_NAME.replace(/^v/, "");
          const start = changelog.indexOf("## " + version + " — ");
          if (start === -1) { console.error("no CHANGELOG section for " + version); process.exit(1); }
          let end = changelog.indexOf("\n## ", start + 1);
          if (end === -1) end = changelog.length;
          console.log(changelog.slice(start, end).trim());
          EOF
          cat release-notes.md | head -3

      - name: Create or update GitHub release without stale latest promotion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          query_release() {
            local endpoint="$1"
            local response_file="$2"
            local command_status
            if gh api --include "$endpoint" >"$response_file"; then
              command_status=0
            else
              command_status=$?
            fi
            GH_RESPONSE_FILE="$response_file" GH_COMMAND_STATUS="$command_status" node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs';
          import {
            classifyGithubReleaseLookup,
            parseGithubApiStatus,
          } from './scripts/release-artifacts.mjs';
          const output = readFileSync(process.env.GH_RESPONSE_FILE, 'utf8');
          process.stdout.write(classifyGithubReleaseLookup({
            httpStatus: parseGithubApiStatus(output),
            commandStatus: Number(process.env.GH_COMMAND_STATUS),
          }));
          EOF
          }

          release_response="$(mktemp)"
          latest_response="$(mktemp)"
          trap 'rm -f "$release_response" "$latest_response"' EXIT

          verify_release_tag() {
            git fetch --no-tags origin "+refs/tags/${GITHUB_REF_NAME}:refs/patina/release-check"
            test "$(git rev-parse 'refs/patina/release-check^{commit}')" = "$GITHUB_SHA"
          }

          # A tag query distinguishes an existing release from auth, network,
          # or gh-tool failures. Only an explicit HTTP 404 means absent.
          release_state="$(query_release "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" "$release_response")"
          if [ "$release_state" = present ]; then
            # A rerun updates only the failed release step and preserves the
            # existing latest marker.
            verify_release_tag
            gh release edit "$GITHUB_REF_NAME" \
              --title "v${VERSION}" \
              --notes-file release-notes.md
            exit 0
          fi

          # /releases/latest is authoritative; do not use the limited release
          # list, whose default page can omit the current latest release.
          latest_state="$(query_release "repos/${GITHUB_REPOSITORY}/releases/latest" "$latest_response")"
          current_latest=""
          if [ "$latest_state" = present ]; then
            current_latest="$(GH_RESPONSE_FILE="$latest_response" node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs';
          import {
            parseGithubApiJson,
            parseGithubReleaseTag,
          } from './scripts/release-artifacts.mjs';
          const release = parseGithubApiJson(readFileSync(process.env.GH_RESPONSE_FILE, 'utf8'));
          process.stdout.write(parseGithubReleaseTag(release.tag_name));
          EOF
            )"
          fi

          action="$(CURRENT_LATEST="$current_latest" CANDIDATE="$VERSION" node --input-type=module <<'EOF'
          import { decideGithubReleaseAction } from './scripts/release-artifacts.mjs';
          process.stdout.write(decideGithubReleaseAction({
            candidateVersion: process.env.CANDIDATE,
            currentLatestVersion: process.env.CURRENT_LATEST || undefined,
          }));
          EOF
          )"
          case "$action" in
            create-latest)
              verify_release_tag
              gh release create "$GITHUB_REF_NAME" \
                --verify-tag \
                --title "v${VERSION}" \
                --notes-file release-notes.md \
                --latest
              ;;
            create-not-latest)
              echo "::warning::Not promoting stale version v${VERSION} to GitHub latest (current latest v${current_latest})."
              verify_release_tag
              gh release create "$GITHUB_REF_NAME" \
                --verify-tag \
                --title "v${VERSION}" \
                --notes-file release-notes.md \
                --latest=false
              ;;
            *)
              echo "::error::Unexpected GitHub release action: $action"
              exit 1
              ;;
          esac

  ghcr:
    needs: [verify, authorize-source]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.publish_ghcr == true
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/devswha/patina
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}

      - name: Build image for runtime verification
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify container startup and offline inspection
        run: |
          expected="patina $(node -p 'require("./package.json").version')"
          actual="$(docker run --rm ghcr.io/devswha/patina:latest --version)"
          test "$actual" = "$expected"
          printf '%s' 'The meeting starts at noon.' > container-smoke-input.txt
          docker run --rm -i ghcr.io/devswha/patina:latest inspect --lang en < container-smoke-input.txt > container-smoke-result.json
          node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const result = JSON.parse(readFileSync('container-smoke-result.json', 'utf8'));
          const sourceHash = createHash('sha256').update(readFileSync('container-smoke-input.txt')).digest('hex');
          if (result.schemaVersion !== 1 || result.deterministicOnly !== true || result.sourceHash !== sourceHash || !Number.isFinite(result.score)) process.exit(1);
          EOF

      - name: Publish verified image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r image_tag; do
            if [ -n "$image_tag" ]; then docker push "$image_tag"; fi
          done <<< "$IMAGE_TAGS"
